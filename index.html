<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--sub:#6b6b70;--ac:#c8102e;--bd:#e4e0d8;--chip:#efe9dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--tx:#f2f2f4;--sub:#a0a0a8;--ac:#ff5a6e;--bd:#2c2c31;--chip:#2a2a2f;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
h1{font-size:20px;margin:14px 16px 2px}.sub{margin:0 16px 10px;color:var(--sub);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:13px;line-height:1.2}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:12px 12px 40px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:16px 0 6px;color:var(--sub)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
th,td{border-bottom:1px solid var(--bd);padding:7px 6px;text-align:left;vertical-align:top}th{color:var(--sub);font-weight:600}
tr.go{cursor:pointer}td:first-child{white-space:nowrap;font-weight:600}
.map{display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:600}
.route{font-size:13px;color:var(--sub);margin:8px 0 0}.route b{color:var(--tx)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}.tl time{flex:none;width:52px;color:var(--ac);font-weight:600;font-size:13px}
.ck li{margin:6px 0}.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--sub)}
.res{padding:10px 0;border-bottom:1px solid var(--bd)}.res:last-child{border:0}.res p{margin:2px 0;font-size:13px;color:var(--sub)}
.res a,.res button{font-size:13px;color:var(--ac);background:none;border:0;padding:4px 10px 4px 0;text-decoration:underline}
.emb{display:block;width:100%;height:280px;border:0;border-radius:12px;margin-bottom:10px;background:var(--chip)}
.note{font-size:12px;color:var(--sub)}
</style></head><body>

{d:'12/13',w:'일',r:'밀라노',tr:'도보, 지하철',ho:'Hilton Milan',m:'두오모, 갈레리아, 성',o:['Hilton Milan','Duomo di Milano','Galleria Vittorio Emanuele II','Castello Sforzesco'],mode:'walking',

{d:'12/15',w:'화',r:'밀라노',tr:'도보, 트램',ho:'Hilton Milan',m:'최후의 만찬, 브레라, 나빌리',o:['Hilton Milan','Cenacolo Vinciano Milan','Pinacoteca di Brera','Navigli Milan'],mode:'transit',

['숙소','Central Plaza (취리히)','12/7 15:00 ~ 12/9 12:00','h1','Central Plaza Zurich'],['숙소','Chalet JOLUKSI (에어비앤비)','Endweg 42, 3818 Grindelwald, 12/9 16:00 이후 ~ 12/12 10:00 전','h2','Endweg 42, 3818 Grindelwald'],['숙소','Hilton Milan','12/12 16:00 ~ 12/16 11:00','h3','Hilton Milan'],
['교통','스위스 하프페어 카드','구매 필요','t1'],['교통','융프라우요흐 티켓','12/10 또는 12/11','t2'],['교통','그린델발트 → 밀라노 열차','12/12','t3'],['교통','렌터카','12/14 베르가모','t4'],['티켓','최후의 만찬','12/15','t5']];
const KEY='';
const emb=x=>{if(!KEY)return '';const q=encodeURIComponent,o=x.o;return '<iframe class="emb" loading="lazy" allowfullscreen src="https://www.google.com/maps/embed/v1/directions?key='+KEY+'&language=ko&origin='+q(o[0])+'&destination='+q(o[o.length-1])+(o.length>2?'&waypoints='+o.slice(1,-1).map(q).join('%7C'):'')+'&mode='+x.mode+'"></iframe>'};
const L=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const S=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const mp=(o,m)=>{const q=encodeURIComponent;return 'https://www.google.com/maps/dir/?api=1&origin='+q(o[0])+'&destination='+q(o[o.length-1])+(o.length>2?'&waypoints='+q(o.slice(1,-1).join('|')):'')+'&travelmode='+m};

else{const x=D[i-1];v.innerHTML=emb(x)+`<a class="map" href="${mp(x.o,x.mode)}" target="_blank" rel="noopener">구글 지도에서 동선 열기</a><p class="route">${x.o.map(s=>'<b>'+s.split(',')[0]+'</b>').join(' → ')}</p><div class="card" style="margin-top:12px"><h2>${x.d} (${x.w}) ${x.r}</h2><span class="chip">${x.tr}</span> <span class="chip">${x.ho}</span><h3>세부 일정</h3><ul class="tl">${x.it.map(t=>`<li><time>${t[0]}</time><span>${t[1]}</span></li>`).join('')}</ul><h3>예약 및 준비</h3><ul class="ck">${x.rs.map(t=>`<li>${t}</li>`).join('')}</ul></div>`}}
function ed(k){const u=prompt('예약 링크(URL)를 붙여넣어 주세요',L(k));if(u!==null){S(k,u.trim());go(cur)}}
